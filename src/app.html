<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Applies a stored theme override before first paint to avoid a flash
			// of the wrong theme; absence of a stored value leaves the OS
			// preference (app.css's prefers-color-scheme block) in charge.
			(function () {
				try {
					var t = localStorage.getItem('pi-web-theme');
					if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				} catch (e) {}
			})();
		</script>
		<title>Keva Chat</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
